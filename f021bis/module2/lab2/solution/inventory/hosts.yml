# Kubespray's group names, from the start: lab 3 runs its playbooks on this
# very file.
all:
  hosts:
    node1:
      ansible_host: 172.30.2.11
    node2:
      ansible_host: 172.30.2.12
    node3:
      ansible_host: 172.30.2.13
  children:
    kube_control_plane:
      hosts:
        node1:
    etcd:
      hosts:
        node1:
    kube_node:
      hosts:
        node2:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
    # Not in the cluster yet: lab 3b moves it to kube_node.
    spare:
      hosts:
        node3:
    # Lab 2: the playbooks of k8s/ run here and talk to the Kubernetes API.
    k8s_api:
      hosts:
        localhost:
