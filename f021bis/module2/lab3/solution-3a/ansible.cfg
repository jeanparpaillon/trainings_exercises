[defaults]
inventory = ./inventory
remote_user = ansible
# Ours first, then Kubespray's: cluster.yml and friends find their roles here
# because we run them from ~/m2, not from ~/kubespray.
roles_path = ./roles:~/kubespray/roles
library = ~/kubespray/library
vault_password_file = ~/.vault_pass
# The nodes are recreated by `make -C lab0 reset`, with new host keys.
host_key_checking = False
# Python 3 is /usr/bin/python3 on every node: no warning about it on every run.
interpreter_python = auto_silent

# From ~/kubespray/ansible.cfg. Facts are cached between runs: scale.yml
# --limit=node3 needs the other nodes' facts without contacting them.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/m2-facts
fact_caching_timeout = 86400
force_valid_group_names = ignore
callbacks_enabled = ansible.posix.profile_tasks

[inventory]
# Kubespray writes admin.conf into inventory/artifacts/: not an inventory file.
ignore_patterns = artifacts, credentials

[privilege_escalation]
become = true

[ssh_connection]
pipelining = True
