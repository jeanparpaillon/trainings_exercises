# Kubespray's group names, from the start: lab 3 runs its playbooks on this
# very file.
all:
  hosts:
    node1:
      ansible_host: 172.30.2.11
    node2:
      ansible_host: 172.30.2.12
    node3:
      ansible_host: 172.30.2.13
  children:
    kube_control_plane:
      hosts:
        node1:
    etcd:
      hosts:
        node1:
    # node1 too: a control plane in kube_node is not tainted. With two nodes,
    # the upgrade (lab 3c) needs it to take the pods of the node it drains.
    kube_node:
      hosts:
        node1:
        node3:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
    # Lab 3b: node3 joined kube_node (scale.yml), node2 was removed
    # (remove-node.yml) and came back here.
    spare:
      hosts:
        node2:
    # Lab 2: the playbooks of k8s/ run here and talk to the Kubernetes API.
    k8s_api:
      hosts:
        localhost:
