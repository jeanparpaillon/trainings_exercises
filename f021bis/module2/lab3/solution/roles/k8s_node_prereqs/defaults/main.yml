# Packages a Kubernetes node needs: conntrack (kube-proxy), socat (port
# forwarding), ipset and ebtables (kube-proxy, CNIs). Kubespray installs them
# too; installing them first changes nothing for it.
k8s_packages:
  - conntrack
  - socat
  - ipset
  - ebtables

# Loaded at boot, from /etc/modules-load.d/k8s.conf: overlay for containerd's
# snapshotter, br_netfilter so that bridged traffic goes through iptables.
k8s_modules:
  - overlay
  - br_netfilter
  # Step 4: kube-proxy's connection tracking.
  - nf_conntrack

# net.* sysctls ONLY. Our nodes are containers: net.* belongs to each node's
# network namespace, but vm.*, kernel.* and fs.* are the server's kernel,
# shared by every node of the room (step 2). A role that set them here would
# tune the server.
k8s_sysctls:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  # Step 4: added once the role was idempotent, applied after --check --diff.
  net.core.somaxconn: 32768

# User for the operators; its password comes from the inventory (Vault).
ops_user: ops
