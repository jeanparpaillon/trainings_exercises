# Step 5: take a node out for maintenance, and put it back.
#   ansible-playbook k8s/maintenance.yml -e node=iac-worker
- name: Node maintenance
  hosts: k8s_api
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig }}"
      context: "{{ k8s_context }}"
  tasks:
    - name: A node is required
      ansible.builtin.assert:
        that: node is defined
        fail_msg: "-e node=<name>"
        quiet: true

    - name: Drain {{ node }}
      kubernetes.core.k8s_drain:
        name: "{{ node }}"
        state: drain
        delete_options:
          ignore_daemonsets: true
          delete_emptydir_data: true
          wait_timeout: 300

    - name: The maintenance itself
      ansible.builtin.pause:
        seconds: "{{ maintenance_seconds | default(30) }}"

    - name: Uncordon {{ node }}
      kubernetes.core.k8s_drain:
        name: "{{ node }}"
        state: uncordon

    - name: Wait for web to be Available again
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: web
        name: web
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 120
