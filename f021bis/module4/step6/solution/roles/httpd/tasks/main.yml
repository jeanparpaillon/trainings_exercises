---
- name: httpd is installed
  package:
    name: httpd
    state: present

- name: HTTP is open in the firewall
  firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled

- name: Home page
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: "0644"

- name: httpd snippet
  template:
    src: m4.conf.j2
    dest: /etc/httpd/conf.d/m4.conf
    mode: "0644"
  notify: Restart httpd

- name: httpd is running and enabled
  service:
    name: httpd
    state: started
    enabled: true

- name: The private directory
  file:
    path: /var/www/html/private
    state: directory
    mode: "0755"

- name: The private page
  copy:
    content: "Private, {{ inventory_hostname }}\n"
    dest: /var/www/html/private/index.html
    mode: "0644"

- name: The private directory asks for a password
  copy:
    content: |
      AuthType Basic
      AuthName "m4 private"
      AuthUserFile /etc/httpd/.htpasswd
      Require valid-user
    dest: /var/www/html/private/.htaccess
    mode: "0644"

- name: The basic-auth user, password from the vault
  copy:
    content: "{{ web_auth_user }}:{{ web_auth_password | password_hash('sha512', web_auth_salt) }}\n"
    dest: /etc/httpd/.htpasswd
    owner: root
    group: apache
    mode: "0640"
  no_log: true
