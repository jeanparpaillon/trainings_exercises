# Lab 2 — the whole nginx.conf, copied as is by web.yml.
# Lab 3 turns it into a template (port, workers, virtual hosts).
user nginx;
worker_processes 2;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /var/log/nginx/access.log;
    sendfile     on;

    server {
        listen      80;
        server_name _;
        root        /usr/share/nginx/html;
        add_header  X-Managed-By ansible;
    }
}
