# Custom metrics API (custom.metrics.k8s.io) from kube-prometheus-stack's
# Prometheus: HPA on request rate (module 3 lab, "HPA on request rate").
# Trainees read the API through infrastructure/configs/rbac/custom-metrics-rbac.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-adapter
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  dependsOn:
    - name: kube-prometheus-stack
  interval: 1h
  releaseName: prometheus-adapter
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: prometheus-adapter
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-adapter-values
