# Vertical Pod Autoscaler, recommender only (module 3 lab, "right-size with
# VPA"): trainees create VPAs in `updateMode: "Off"` and read
# `status.recommendation`. No updater, no admission webhook: nothing on the
# cluster ever rewrites an trainee's pods.
#
# The VPA CRD is in the chart's crds/; trainees get the type through
# infrastructure/configs/rbac/vpa-rbac.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  releaseName: vpa
  targetNamespace: vpa
  storageNamespace: vpa
  chart:
    spec:
      chart: vpa
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: vpa-values
