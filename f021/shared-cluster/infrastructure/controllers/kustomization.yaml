# Platform Helm releases. They live in flux-system next to their
# HelmRepository (--no-cross-namespace-refs) and install into their own
# namespace with targetNamespace; storageNamespace keeps the Helm history
# there too, under the same release names as the hand-installed releases.
#
# Values stay plain values files, turned into ConfigMaps here. The name hash
# is kept, and kustomizeconfig.yaml rewrites the HelmRelease references with
# it, so editing a values file upgrades the release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - repositories.yaml
  - traefik.yaml
  - linkerd.yaml
  - kube-prometheus-stack.yaml
  - headlamp.yaml
  - metrics-server.yaml
  - vpa.yaml
  - prometheus-adapter.yaml
configMapGenerator:
  - name: traefik-values
    namespace: flux-system
    files: [values.yaml=traefik-values.yaml]
  - name: linkerd-control-plane-values
    namespace: flux-system
    files: [values.yaml=linkerd-control-plane-values.yaml]
  - name: linkerd-viz-values
    namespace: flux-system
    files: [values.yaml=linkerd-viz-values.yaml]
  - name: kube-prometheus-stack-values
    namespace: flux-system
    files: [values.yaml=kube-prometheus-stack-values.yaml]
  - name: headlamp-values
    namespace: flux-system
    files: [values.yaml=headlamp-values.yaml]
  - name: metrics-server-values
    namespace: flux-system
    files: [values.yaml=metrics-server-values.yaml]
  - name: vpa-values
    namespace: flux-system
    files: [values.yaml=vpa-values.yaml]
  - name: prometheus-adapter-values
    namespace: flux-system
    files: [values.yaml=prometheus-adapter-values.yaml]
configurations:
  - kustomizeconfig.yaml
