# Resource metrics API (metrics.k8s.io): `kubectl top`, HPA on CPU / memory
# (module 3 lab "measure, right-size, autoscale"), VPA recommender input.
# The chart aggregates read access to metrics.k8s.io into admin/edit/view.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  releaseName: metrics-server
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  valuesFrom:
    - kind: ConfigMap
      name: metrics-server-values
