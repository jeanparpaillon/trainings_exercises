apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  dependsOn:
    - name: traefik         # Middleware CRD of extraManifests
  interval: 1h
  releaseName: headlamp
  targetNamespace: headlamp
  storageNamespace: headlamp
  chart:
    spec:
      chart: headlamp
      # Same as the f021bis cluster (its Makefile, HEADLAMP_VERSION).
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  valuesFrom:
    - kind: ConfigMap
      name: headlamp-values
