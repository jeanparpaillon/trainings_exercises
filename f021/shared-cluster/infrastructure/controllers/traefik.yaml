apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  releaseName: traefik
  targetNamespace: traefik
  storageNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: 41.7.1
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
