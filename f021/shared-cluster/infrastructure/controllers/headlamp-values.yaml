# Helm values of `headlamp` (headlamp.yaml).
#
# https://srv2052563.hstgr.cloud/headlamp/. Headlamp's own ServiceAccount
# gets no cluster role (clusterRoleBinding.create: false): each trainee logs
# in with the token of ServiceAccount `headlamp` in their own namespace,
# whose rights come from tenants/<name>.yaml:
#
#   kubectl -n <name> create token headlamp --duration=168h
clusterRoleBinding:
  create: false
config:
  # Headlamp serves under the prefix itself: no strip-prefix middleware. But
  # it answers 404 to /headlamp without the slash, hence `slash` below (as on
  # the f021bis cluster).
  baseURL: /headlamp
  watchPlugins: true
pluginsManager:
  enabled: true
  configContent: |
    plugins:
      - name: flux
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
        version: 0.7.0
    installOptions:
      parallel: true
      maxConcurrent: 2
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-slash@kubernetescrd
  hosts:
    - host: srv2052563.hstgr.cloud
      paths:
        - path: /headlamp
          type: Prefix
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
# Needs Traefik's Middleware CRD: headlamp.yaml dependsOn traefik.
extraManifests:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: slash
      namespace: headlamp
    spec:
      redirectRegex:
        regex: ^(https?://[^/]+/headlamp)$
        replacement: ${1}/
        permanent: true
