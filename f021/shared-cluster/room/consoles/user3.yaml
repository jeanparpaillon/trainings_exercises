# Web console of trainee user3 — generated by bin/render from
# templates/console.yaml.tmpl. Do not edit: edit the template.
#
# ttyd serving `bash -l` at https://srv2052563.hstgr.cloud/user3/, behind basic auth: login
# `user3`, password from Secret consoles/console-user3 (secrets.yaml, same
# password as their Grafana login). Image from console/ (make image): kubectl,
# helm, flux, git, jq, curl, dig. The home directory is a PVC, so whatever
# the trainee installs in ~/bin or clones survives pod restarts.
#
# The pod runs as ServiceAccount console-user3, as user `ubuntu` (uid 1000):
# console-init writes a kubeconfig context `training` with that ServiceAccount's
# token and namespace user3, where it is `admin` (tenants/user3.yaml); cluster
# read comes through group system:serviceaccounts:consoles.
#
# Same layout as the f021bis consoles (../../f021bis/shared-cluster), without
# their dind sidecar.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-user3
  namespace: consoles
  labels:
    console: user3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: console-user3-home
  namespace: consoles
  labels:
    console: user3
  annotations:
    # The trainee's work lives here: never pruned by Flux.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: standard
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-user3
  namespace: consoles
  labels:
    console: user3
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO home volume
  selector:
    matchLabels:
      console: user3
  template:
    metadata:
      labels:
        console: user3
    spec:
      serviceAccountName: console-user3
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: console
          image: console
          # Loaded into the kind node by make image, never pulled.
          imagePullPolicy: IfNotPresent
          args:
            - ttyd
            - --writable
            - --port=7681
            - --base-path=/user3
            - --credential=user3:$(CONSOLE_PASSWORD)
            - bash
            - -l
          env:
            - name: CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: console-user3
                  key: password
            - name: NS
              value: user3
            - name: HOME
              value: /home/ubuntu
          workingDir: /home/ubuntu
          ports:
            - name: http
              containerPort: 7681
          volumeMounts:
            - name: home
              mountPath: /home/ubuntu
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: console-user3-home
---
apiVersion: v1
kind: Service
metadata:
  name: console-user3
  namespace: consoles
  labels:
    console: user3
spec:
  selector:
    console: user3
  ports:
    - name: http
      port: 7681
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console-user3
  namespace: consoles
  labels:
    console: user3
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: srv2052563.hstgr.cloud
      http:
        paths:
          - path: /user3
            pathType: Prefix
            backend:
              service:
                name: console-user3
                port:
                  name: http
