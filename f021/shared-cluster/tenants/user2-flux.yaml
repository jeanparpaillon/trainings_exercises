# Module 6 Flux tenant of trainee user2 — generated by bin/render from
# templates/tenant-flux.yaml.tmpl. Listed, commented out, in
# tenants/kustomization.yaml: the trainer enables it at step 3 of the module 6
# GitOps lab (make enable-flux), "the tenant is in the platform's fleet repo".
#
# Before enabling: the config repo jeanparpaillon/f021-user2 exists (make
# config-repos, from ../module6/repo/) and its deploy key is registered
# (make deploy-keys). Secret user2/f021-repo comes from secrets.yaml
# (bin/gen-secrets).
#
# The Kustomizations run as ServiceAccount `flux`, with the built-in `edit`
# role in user2: they deploy WordPress's objects, and cannot touch RBAC,
# quotas or other namespaces. The controllers' --default-service-account
# lockdown means forgetting serviceAccountName gives them no rights at all.
#
# One Kustomization per environment, on its overlay; `wait` makes health
# part of Ready (step 7: a refused or unhealthy apply shows as not Ready, and
# as a failed commit status).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux
  namespace: user2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-edit
  namespace: user2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - { kind: ServiceAccount, name: flux, namespace: user2 }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: f021
  namespace: user2
spec:
  interval: 1m
  url: ssh://git@github.com/jeanparpaillon/f021-user2
  ref:
    branch: main
  secretRef:
    name: f021-repo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wordpress-dev
  namespace: user2
spec:
  serviceAccountName: flux
  interval: 1m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: f021
  path: ./envs/dev
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wordpress-prod
  namespace: user2
spec:
  serviceAccountName: flux
  interval: 1m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: f021
  path: ./envs/prod
  prune: true
  wait: true
