# Tenant of trainee user2 — generated by bin/render from templates/tenant.yaml.tmpl.
#
# The three identities an trainee uses, and what each gets:
#
#   User user2                    their kubectl certificate (CN=user2, O=trainees)
#   SA consoles/console-user2     their web console
#   SA user2/headlamp             their Headlamp login token
#
# `admin` in this namespace for all three. Cluster-wide read for the first two
# comes from their groups (infrastructure/configs/rbac/trainee-read.yaml);
# Headlamp's ServiceAccount is bound here, by name.
#
# Also here: the `trainee` quota and default requests, and the right to label
# their own namespace (Pod Security lab).
apiVersion: v1
kind: Namespace
metadata:
  name: user2
  annotations:
    # Dropping user2 from trainees.txt stops managing the namespace, it never
    # deletes it with everything the trainee built.
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: user2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trainee-admin
  namespace: user2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: user2 }
  - { kind: ServiceAccount, name: console-user2, namespace: consoles }
  - { kind: ServiceAccount, name: headlamp, namespace: user2 }
---
# Namespaces are cluster-scoped, so `admin` in user2 cannot change user2's own
# labels. The module 5 Pod Security lab sets pod-security.kubernetes.io/*
# labels on it (warn, then enforce `restricted`). RBAC cannot narrow this to
# some label keys; no right is gained by it: an unlabelled namespace already
# admits privileged pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trainee-user2-namespace-labels
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [user2]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainee-user2-namespace-labels
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trainee-user2-namespace-labels
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: user2 }
  - { kind: ServiceAccount, name: console-user2, namespace: consoles }
---
# Ceilings, not reservations: the node is shared by the whole room. When
# everybody pushes at once it is the scheduler (Pending pods) that stops
# them; limits.memory is what protects the node from an OOM. A refused pod
# shows on its ReplicaSet (`kubectl describe rs`, "exceeded quota: trainee"),
# not in `kubectl apply`. Trainees can read the quota, not change it (the
# module 4 troubleshooting scenario that tightens it is run by the trainer).
#
# Named `trainee`, not `tenant`: the module 7 tenants demo applies its own
# stricter quota on top, and the strictest one wins per resource.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: trainee
  namespace: user2
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    # No limits.cpu: a CPU limit throttles instead of killing, which would
    # skew the load labs of module 3.
    limits.memory: 4Gi
    # Bookinfo and WordPress + MySQL (twice, dev and prod, in module 6), plus
    # HPA replicas and load generators.
    pods: "30"
    # Module 2 storage lab: a few RWO volumes on local-path.
    persistentvolumeclaims: "5"
    requests.storage: 10Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
# Required as soon as the quota covers requests: without these defaults every
# pod that sets no requests (Bookinfo sets none) is rejected. Only applies to
# pods created after it.
apiVersion: v1
kind: LimitRange
metadata:
  name: trainee
  namespace: user2
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      default:        { cpu: 500m, memory: 256Mi }
      max:            { cpu: "2",  memory: 2Gi }
    - type: PersistentVolumeClaim
      max: { storage: 5Gi }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainee-user2-headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - { kind: ServiceAccount, name: headlamp, namespace: user2 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainee-user2-headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trainee-cluster-read
subjects:
  - { kind: ServiceAccount, name: headlamp, namespace: user2 }
