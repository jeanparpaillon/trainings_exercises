# Module 6 Flux tenant of trainee user5 — generated by bin/render from
# templates/tenant-flux.yaml.tmpl. Listed, commented out, in
# tenants/kustomization.yaml: the trainer uncomments it during the module 6
# GitOps lab ("the tenant is already in the trainer's fleet repo").
#
# Before uncommenting: the config repo jeanparpaillon/f021-user5 exists (created by
# the trainer from the sample app, whoever is user5 as collaborator), and its
# deploy key is registered. Secret user5/f021-repo comes from secrets.yaml
# (bin/gen-secrets); its public half goes on the repo with
#   make deploy-keys user5S=user5
#
# The Kustomization runs as ServiceAccount `flux`, with the built-in `edit`
# role in user5: it deploys the sample app's objects (Flux's HelmRelease &
# co are aggregated into `edit`), and cannot touch RBAC, quotas or other
# namespaces. The controllers' --default-service-account lockdown means
# forgetting serviceAccountName gives it no rights at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux
  namespace: user5
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-edit
  namespace: user5
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - { kind: ServiceAccount, name: flux, namespace: user5 }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: f021
  namespace: user5
spec:
  interval: 1m
  url: ssh://git@github.com/jeanparpaillon/f021-user5
  ref:
    branch: main
  secretRef:
    name: f021-repo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sample-app
  namespace: user5
spec:
  serviceAccountName: flux
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: f021
  path: ./deploy
  prune: true
