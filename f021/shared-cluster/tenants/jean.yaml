# Tenant of trainee jean — generated by bin/render from templates/tenant.yaml.tmpl.
#
# The three identities an trainee uses, and what each gets:
#
#   User jean                    their kubectl certificate (CN=jean, O=trainees)
#   SA consoles/console-jean     their web console
#   SA jean/headlamp             their Headlamp login token
#
# `admin` in this namespace for all three. Cluster-wide read for the first two
# comes from their groups (infrastructure/configs/rbac/trainee-read.yaml);
# Headlamp's ServiceAccount is bound here, by name.
#
# Also here: the `trainee` quota and default requests, the right to label
# their own namespace (Pod Security lab), and their Grafana data source for
# the tracing lab (in namespace monitoring).
apiVersion: v1
kind: Namespace
metadata:
  name: jean
  annotations:
    # Dropping jean from trainees.txt stops managing the namespace, it never
    # deletes it with everything the trainee built.
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: jean
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trainee-admin
  namespace: jean
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: jean }
  - { kind: ServiceAccount, name: console-jean, namespace: consoles }
  - { kind: ServiceAccount, name: headlamp, namespace: jean }
---
# Namespaces are cluster-scoped, so `admin` in jean cannot change jean's own
# labels. The module 5 Pod Security lab sets pod-security.kubernetes.io/*
# labels on it (warn, then enforce `restricted`). RBAC cannot narrow this to
# some label keys; no right is gained by it: an unlabelled namespace already
# admits privileged pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trainee-jean-namespace-labels
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [jean]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainee-jean-namespace-labels
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trainee-jean-namespace-labels
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: jean }
  - { kind: ServiceAccount, name: console-jean, namespace: consoles }
---
# Ceilings, not reservations: the node is shared by the whole room. When
# everybody pushes at once it is the scheduler (Pending pods) that stops
# them; limits.memory is what protects the node from an OOM. A refused pod
# shows on its ReplicaSet (`kubectl describe rs`, "exceeded quota: trainee"),
# not in `kubectl apply`. Trainees can read the quota, not change it (the
# module 4 troubleshooting scenario that tightens it is run by the trainer).
#
# Named `trainee`, not `tenant`: the module 7 tenants demo applies its own
# stricter quota on top, and the strictest one wins per resource.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: trainee
  namespace: jean
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    # No limits.cpu: a CPU limit throttles instead of killing, which would
    # skew the load labs of module 3.
    limits.memory: 4Gi
    # Bookinfo and WordPress + MySQL (twice, dev and prod, in module 6), plus
    # HPA replicas and load generators.
    pods: "30"
    # Module 2 storage lab: a few RWO volumes on local-path.
    persistentvolumeclaims: "5"
    requests.storage: 10Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
# Required as soon as the quota covers requests: without these defaults every
# pod that sets no requests (Bookinfo sets none) is rejected. Only applies to
# pods created after it.
apiVersion: v1
kind: LimitRange
metadata:
  name: trainee
  namespace: jean
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      default:        { cpu: 500m, memory: 256Mi }
      max:            { cpu: "2",  memory: 2Gi }
    - type: PersistentVolumeClaim
      max: { storage: 5Gi }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainee-jean-headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - { kind: ServiceAccount, name: headlamp, namespace: jean }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainee-jean-headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trainee-cluster-read
subjects:
  - { kind: ServiceAccount, name: headlamp, namespace: jean }
---
# Grafana data source "Jaeger jean", for the module 4 tracing lab: reads the
# Jaeger the trainee deploys in jean (module4/tracing/step1-deploy). Errors
# until that Jaeger exists. Editors cannot create data sources, so the
# platform provides it: Grafana's datasource sidecar loads ConfigMaps
# labelled grafana_datasource: "1" from namespace monitoring (its own, the
# chart default). One file per trainee in the same folder: the key carries
# the name.
#
# Grafana's Jaeger data source reads Jaeger's legacy /api/* query API, which
# Jaeger 2.21 removed: the lab pins Jaeger 2.20.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trainee-jean-jaeger-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  jaeger-jean.yaml: |
    apiVersion: 1
    datasources:
      - name: Jaeger jean
        uid: jaeger-jean
        type: jaeger
        access: proxy
        url: http://jaeger.jean.svc:16686
        jsonData:
          nodeGraph:
            enabled: true
