# nginx, two replicas. The selector and the template labels must match:
# that is how the Deployment (through its ReplicaSet) finds its pods.
# No resources written: the namespace LimitRange fills them in at
# admission (`kubectl get pod -o yaml` shows them).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - containerPort: 80
              name: http
