# The app pipeline, step 5: build, scan, push — then propose the new tag
# for dev as a pull request. Nothing here touches the cluster: Flux does.
name: image

on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag is the last commit that changed app/: a commit that only
      # touches manifests does not make a new image, and rebuilding the same
      # source gives the same tag.
      - id: tag
        name: Image name and tag
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git log -1 --format=%H -- app | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Tags are immutable: never push over one that exists.
      - id: exists
        name: Already pushed?
        env:
          REF: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
        run: |
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "$REF exists, nothing to build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.exists.outputs.exists != 'true'
        env:
          REF: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build app -t "$REF" --build-arg VERSION="$TAG" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      # Fails on critical vulnerabilities that have a fix; reports the rest.
      - name: Scan
        if: steps.exists.outputs.exists != 'true'
        env:
          REF: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --no-progress --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 "$REF"

      - name: Push
        if: steps.exists.outputs.exists != 'true'
        env:
          REF: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
        run: docker push "$REF"

  # The GitOps way: the last step of the pipeline is a pull request that
  # changes one line, newTag in envs/dev. Merging it is the deployment.
  bump-dev:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set the tag in envs/dev
        env:
          REF: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
        run: cd envs/dev && kustomize edit set image "wordpress=$REF"

      # Checked here, not by the manifests workflow: a pull request opened
      # with GITHUB_TOKEN does not trigger other workflows.
      - name: Render and validate
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          kubectl kustomize envs/dev | "$RUNNER_TEMP/kubeconform" -strict -summary

      # One branch for every bump: a newer image updates the open pull
      # request instead of opening another one.
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bump/dev
          commit-message: "dev: ${{ needs.image.outputs.tag }}"
          title: "dev: ${{ needs.image.outputs.tag }}"
          body: |
            Deploys `${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}` to **dev**,
            built from ${{ github.sha }} by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
          delete-branch: true
