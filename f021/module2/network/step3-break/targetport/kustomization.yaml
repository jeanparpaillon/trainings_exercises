apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../step2-gateway

# The Service forwards to a port nothing listens on.
patches:
  - target: { kind: Service, name: wordpress }
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8080
