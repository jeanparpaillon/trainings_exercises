apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../step2-gateway

# The route answers for a host name nobody calls.
patches:
  - target: { kind: HTTPRoute, name: bookinfo }
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: bookinfo-gw.example.invalid
