# What the application needs back, and nothing more. Policies add up: each
# one opens a flow the default-deny closed. A flow needs BOTH ends open:
# egress on the client, ingress on the server.

# DNS, to CoreDNS in kube-system, for every pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# WordPress may call MySQL on 3306 — the client's side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wordpress-to-mysql
spec:
  podSelector:
    matchLabels: { app: wordpress }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: mysql }
      ports:
        - { protocol: TCP, port: 3306 }
---
# MySQL accepts WordPress, and only WordPress — the server's side. The
# toolbox, a neighbour, anything else: refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-from-wordpress
spec:
  podSelector:
    matchLabels: { app: mysql }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: wordpress }
      ports:
        - { protocol: TCP, port: 3306 }
---
# Traefik (namespace traefik) reaches WordPress on its HTTP port, for the
# Ingress and the HTTPRoute alike.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
spec:
  podSelector:
    matchLabels: { app: wordpress }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
      ports:
        - { protocol: TCP, port: 80 }
