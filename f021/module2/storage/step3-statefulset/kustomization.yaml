apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# From the end of step 1 (one WordPress is enough again), with the MySQL
# Deployment and its claim replaced by a StatefulSet.
resources:
  - ../../../module1/wordpress/step2-config
  - mysql-statefulset.yaml

patches:
  - target:
      kind: Deployment
      name: mysql
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mysql
