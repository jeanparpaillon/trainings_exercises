apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../step1-look
  - podmonitor.yaml

# MySQL exposes no Prometheus metrics: an exporter next to it does, as a
# sidecar in the same pod (same network namespace: it reaches MySQL on
# 127.0.0.1). It logs in as the `wordpress` user, password from the same
# Secret: SHOW GLOBAL STATUS / VARIABLES need no extra grant. The one
# default collector that does (replica status, REPLICATION CLIENT) is off.
patches:
  - target:
      kind: StatefulSet
      name: mysql
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: mysql
      spec:
        template:
          spec:
            containers:
              - name: exporter
                image: prom/mysqld-exporter:v0.21.0
                args:
                  - --mysqld.address=127.0.0.1:3306
                  - --mysqld.username=wordpress
                  - --no-collect.slave_status
                env:
                  - name: MYSQLD_EXPORTER_PASSWORD
                    valueFrom:
                      secretKeyRef: { name: wordpress-db, key: password }
                ports:
                  - containerPort: 9104
                    name: metrics
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 64Mi
