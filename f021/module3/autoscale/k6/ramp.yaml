# The benchmark of the lab: an open-loop ramp against productpage, from 1
# to RATE requests per second over 3 minutes, then 1 minute at RATE. Every
# before / after number comes from this run, unchanged.
#
#   kubectl -n "$NS" delete job k6 --ignore-not-found
#   kubectl -n "$NS" apply -f k6/ramp.yaml
#   kubectl -n "$NS" logs -f job/k6        # summary at the end
#
# On the shared cluster the ramps are staggered: wait for your slot.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-ramp
  labels:
    app: k6
data:
  script.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    const RATE = Number(__ENV.RATE);

    export const options = {
      // A new connection per iteration: kube-proxy balances connections,
      // so reused ones would stay on the pods that existed when the ramp
      // started, and pods added by the HPA would get nothing.
      noVUConnectionReuse: true,
      scenarios: {
        ramp: {
          executor: 'ramping-arrival-rate',
          startRate: 1,
          timeUnit: '1s',
          preAllocatedVUs: 20,
          maxVUs: 100,
          stages: [
            { target: RATE, duration: '3m' },
            { target: RATE, duration: '1m' },
          ],
        },
      },
      summaryTrendStats: ['med', 'p(95)', 'p(99)', 'max'],
    };

    export default function () {
      const res = http.get(__ENV.TARGET, { timeout: '10s' });
      check(res, { 'status 200': (r) => r.status === 200 });
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6
  labels:
    app: k6
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: k6
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          imagePullPolicy: IfNotPresent
          args: ["run", "--quiet", "/scripts/script.js"]
          env:
            - name: TARGET
              value: http://productpage:9080/productpage
            - name: RATE
              value: "30"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-ramp
