# productpage scales on CPU, measured against its request (100m, set by
# this step). maxReplicas 3: the namespace quota is 1 CPU requested.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: productpage
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: productpage-v1
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  # Second half of the step: uncomment, re-apply, rerun the ramp.
  # behavior:
  #   scaleUp:
  #     stabilizationWindowSeconds: 0
  #     policies:
  #       - { type: Percent, value: 100, periodSeconds: 15 }
  #   scaleDown:
  #     stabilizationWindowSeconds: 120
  #     policies:
  #       - { type: Pods, value: 1, periodSeconds: 60 }
