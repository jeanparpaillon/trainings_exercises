# productpage scales on what its users do: requests per second per pod,
# served by the cluster's Prometheus Adapter from the Linkerd proxy's
# request_total. Check the metric exists before trusting this HPA:
#   kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta1/namespaces/$NS/pods/*/requests_per_second"
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: productpage-rps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: productpage-v1
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Pods
      pods:
        metric:
          name: requests_per_second
        target:
          type: AverageValue
          averageValue: "10"
