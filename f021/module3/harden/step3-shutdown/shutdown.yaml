# Graceful shutdown, on every Bookinfo Deployment.
#
# When a pod is deleted, two things start AT THE SAME TIME:
#   - the endpoints controller removes it from the EndpointSlice, and
#     every kube-proxy, ingress controller and mesh proxy then updates on
#     its own schedule;
#   - the kubelet runs preStop, then sends SIGTERM to the container.
# Without preStop, the application stops accepting while clients are still
# being sent to it: the failed requests of every rolling update.
#
#   preStop sleep 5 s    the pod keeps serving while the endpoint removal
#                        propagates. Kubernetes' own sleep action (GA in
#                        1.33): no `sleep` binary needed in the image.
#   terminationGracePeriodSeconds 30
#                        the budget for EVERYTHING: preStop + the drain of
#                        in-flight requests after SIGTERM. Exceeded =
#                        SIGKILL. Written out: it must stay larger than the
#                        sleep plus the drain.
#
# productpage also has a Linkerd proxy, which must outlive the app. As a
# native sidecar it does by construction (the kubelet stops sidecars after
# the app containers); the annotation covers a mesh installed without
# native sidecars, where it adds a preStop to the proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v1
spec:
  template:
    metadata:
      annotations:
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "10"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: productpage
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
